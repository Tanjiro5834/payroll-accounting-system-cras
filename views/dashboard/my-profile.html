    <main class="lg:pl-72">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8 pb-24">

            <div class="mb-6 page-enter">
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-ink">My Profile</h1>
                <p class="text-sm text-slate-500 mt-1">Your photo, account details and password.</p>
            </div>

            <p id="load-error" class="hidden mb-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3"></p>

            <div class="grid gap-5 lg:grid-cols-[1fr_1.15fr] items-start stagger">

                <!-- Profile -->
                <section class="bg-white rounded-2xl border border-line shadow-sm overflow-hidden">
                    <div class="h-20 bg-gradient-to-r from-ink via-ink-800 to-coolant"></div>
                    <div class="px-5 sm:px-6 pb-6 -mt-12">
                        <div id="avatar" class="w-24 h-24 rounded-full bg-coolant ring-4 ring-white flex items-center justify-center overflow-hidden"></div>
                        <h2 id="p-name" class="mt-3 text-xl font-bold tracking-tight text-ink">&nbsp;</h2>
                        <p id="p-sub" class="text-sm text-slate-500">&nbsp;</p>

                        <div class="mt-4 flex flex-wrap gap-2">
                            <label class="ui-btn inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold min-h-[44px] bg-coolant hover:bg-coolant-hover text-white cursor-pointer focus-within:ring-2 focus-within:ring-frost">
                                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" /></svg>
                                <span id="upload-label">Upload photo</span>
                                <input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp" class="sr-only">
                            </label>
                            <button type="button" id="photo-remove" class="hidden ui-btn px-4 py-2.5 rounded-xl text-sm font-semibold min-h-[44px] border border-line text-negative hover:bg-red-50">Remove</button>
                        </div>
                        <p class="text-xs text-slate-400 mt-2">JPG or PNG, max 5MB.</p>

                        <dl class="mt-6 pt-5 border-t border-line space-y-3 text-sm" id="details"></dl>
                        <p class="mt-4 text-xs text-slate-400">Need to change your name, role or government IDs? Ask the office admin.</p>
                    </div>
                </section>

                <!-- Password -->
                <section class="bg-white rounded-2xl border border-line shadow-sm p-5 sm:p-6">
                    <h2 class="text-base font-bold tracking-tight text-ink">Change password</h2>
                    <p class="text-sm text-slate-500 mt-1 mb-5">Use at least 8 characters. Don't reuse your old one.</p>

                    <form id="password-form" class="space-y-4" autocomplete="on">
                        <input type="text" name="username" autocomplete="username" class="hidden" aria-hidden="true" tabindex="-1">
                        <div>
                            <label for="current_password" class="block text-sm font-semibold text-ink-700 mb-1.5">Current password</label>
                            <div class="relative">
                                <input type="password" id="current_password" required autocomplete="current-password" class="w-full px-3.5 py-2.5 pr-11 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]">
                                <button type="button" data-toggle="current_password" class="absolute inset-y-0 right-0 w-11 flex items-center justify-center text-slate-400 hover:text-coolant" aria-label="Show password">
                                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
                                </button>
                            </div>
                        </div>
                        <div>
                            <label for="new_password" class="block text-sm font-semibold text-ink-700 mb-1.5">New password</label>
                            <div class="relative">
                                <input type="password" id="new_password" required minlength="8" autocomplete="new-password" class="w-full px-3.5 py-2.5 pr-11 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]">
                                <button type="button" data-toggle="new_password" class="absolute inset-y-0 right-0 w-11 flex items-center justify-center text-slate-400 hover:text-coolant" aria-label="Show password">
                                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
                                </button>
                            </div>
                        </div>
                        <div class="h-1.5 rounded-full bg-ink-100 overflow-hidden !mt-2"><div id="strength-bar" class="h-full w-0 rounded-full transition-all"></div></div>
                        <p id="strength-text" class="text-xs text-slate-400 !mt-1.5 min-h-[1rem]"></p>
                        <div>
                            <label for="confirm_password" class="block text-sm font-semibold text-ink-700 mb-1.5">Confirm new password</label>
                            <div class="relative">
                                <input type="password" id="confirm_password" required minlength="8" autocomplete="new-password" class="w-full px-3.5 py-2.5 pr-11 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]">
                                <button type="button" data-toggle="confirm_password" class="absolute inset-y-0 right-0 w-11 flex items-center justify-center text-slate-400 hover:text-coolant" aria-label="Show password">
                                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
                                </button>
                            </div>
                        </div>
                        <p id="match-text" class="text-xs -mt-2 hidden"></p>
                        <button type="submit" id="password-save" class="ui-btn w-full inline-flex items-center justify-center gap-2 px-4 py-3 rounded-xl text-sm font-bold min-h-[48px] bg-coolant hover:bg-coolant-hover text-white shadow-sm focus:outline-none focus:ring-2 focus:ring-frost disabled:opacity-60">Update password</button>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <div id="toast-container" class="fixed bottom-4 inset-x-0 z-[80] flex flex-col items-center gap-2 px-4 pointer-events-none pb-safe" aria-live="polite"></div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/my-profile.js"></script>
</body>
</html>
