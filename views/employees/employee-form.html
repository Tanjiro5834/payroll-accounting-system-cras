    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="lg:pl-72">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8">

            <!-- Page Header -->
            <div class="mb-6 lg:mb-8 page-enter">
                <a href="index.php?page=employees" class="inline-flex items-center gap-1 text-xs font-medium text-slate-500 hover:text-coolant transition-colors mb-3 min-h-[44px]">
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" /></svg>
                    Back to Employees
                </a>
                <h1 id="page-title" class="text-2xl sm:text-3xl font-bold tracking-tight text-ink">Add Employee</h1>
                <p id="page-subtitle" class="text-sm text-slate-500 mt-1">Create a new employee record.</p>
            </div>

            <form id="employee-form" method="POST" class="space-y-6">

                <!-- ============ Personal Info ============ -->
                <section class="bg-white rounded-2xl border border-line shadow-sm p-4 sm:p-6 page-enter">
                    <h2 class="text-sm font-bold tracking-tight text-ink mb-4 pb-3 border-b border-line">Personal Information</h2>

                    <!-- Avatar Upload -->
                    <div class="flex flex-col sm:flex-row items-start gap-5 mb-5">
                        <div class="flex-shrink-0">
                            <div id="avatar-preview" class="w-24 h-24 rounded-full bg-coolant flex items-center justify-center border-4 border-ink-50 overflow-hidden">
                                <span id="avatar-initials" class="text-white font-bold text-2xl">?</span>
                            </div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <label for="photo" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Profile Photo</label>
                            <input type="file" id="photo" name="photo" accept="image/*" class="block w-full text-sm text-slate-600 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-coolant-tint file:text-coolant-hover file:cursor-pointer cursor-pointer rounded-xl border border-line focus:outline-none focus:ring-2 focus:ring-frost min-h-[44px]">
                            <p class="text-xs text-slate-400 mt-1.5">JPG or PNG, max 2MB.</p>
                            <button type="button" id="remove-photo" class="hidden mt-2 text-xs font-medium text-negative hover:text-negative/80 transition-colors">Remove photo</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="sm:col-span-2">
                            <label for="full_name" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Full Name <span class="text-negative">*</span></label>
                            <input type="text" id="full_name" name="full_name" required autocomplete="name" class="w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]" placeholder="e.g. Juan Dela Cruz">
                        </div>

                        <div>
                            <label for="role" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Role <span class="text-negative">*</span></label>
                            <input type="text" id="role" name="role" list="role-options" required maxlength="50" autocomplete="off" class="w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]" placeholder="e.g. Technician">
                            <datalist id="role-options">
                                <option value="Technician">
                                <option value="Admin">
                                <option value="Secretary">
                                <option value="Driver">
                                <option value="Helper">
                                <option value="Construction Worker">
                                <option value="Web Developer"></option>
                            </datalist>
                        </div>

                        <div>
                            <label for="date_hired" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Date Hired <span class="text-negative">*</span></label>
                            <input type="date" id="date_hired" name="date_hired" required class="num w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]">
                        </div>
                    </div>
                </section>

                <!-- ============ Government IDs ============ -->
                <section class="bg-white rounded-2xl border border-line shadow-sm p-4 sm:p-6 page-enter">
                    <h2 class="text-sm font-bold tracking-tight text-ink mb-4 pb-3 border-b border-line">Government IDs</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="sss" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">SSS Number</label>
                            <input type="text" id="sss" name="sss" inputmode="numeric" class="num w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]" placeholder="00-0000000-0">
                        </div>
                        <div>
                            <label for="philhealth" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">PhilHealth Number</label>
                            <input type="text" id="philhealth" name="philhealth" inputmode="numeric" class="num w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]" placeholder="00-000000000-0">
                        </div>
                        <div>
                            <label for="pagibig" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Pag-IBIG Number</label>
                            <input type="text" id="pagibig" name="pagibig" inputmode="numeric" class="num w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]" placeholder="0000-0000-0000">
                        </div>
                        <div>
                            <label for="tin" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">TIN Number</label>
                            <input type="text" id="tin" name="tin" inputmode="numeric" class="num w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]" placeholder="000-000-000-000">
                        </div>
                    </div>
                </section>

                <!-- ============ Pay Settings ============ -->
                <section class="bg-white rounded-2xl border border-line shadow-sm p-4 sm:p-6 page-enter">
                    <h2 class="text-sm font-bold tracking-tight text-ink mb-4 pb-3 border-b border-line">Pay Settings</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="sm:col-span-2">
                            <label for="pay_frequency" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Pay Frequency <span class="text-negative">*</span></label>
                            <select id="pay_frequency" name="pay_frequency" required class="w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]">
                                <option value="">Select frequency…</option>
                                <option value="weekly">Weekly</option>
                                <option value="kinsenas">Kinsenas (Semi-monthly)</option>
                                <option value="monthly">Monthly</option>
                            </select>
                        </div>

                        <div id="hourly-wrap">
                            <label for="hourly_rate" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Hourly Rate (₱)</label>
                            <input type="number" id="hourly_rate" name="hourly_rate" step="0.01" min="0" class="num w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]" placeholder="0.00">
                        </div>

                        <div id="monthly-wrap">
                            <label for="monthly_rate" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Monthly Rate (₱)</label>
                            <input type="number" id="monthly_rate" name="monthly_rate" step="0.01" min="0" class="num w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]" placeholder="0.00">
                        </div>
                    </div>
                </section>

                <!-- ============ Status ============ -->
                <section class="bg-white rounded-2xl border border-line shadow-sm p-4 sm:p-6 page-enter">
                    <div class="flex items-center justify-between gap-4">
                        <div>
                            <label for="active" class="text-sm font-bold tracking-tight text-ink cursor-pointer">Active Employee</label>
                            <p class="text-xs text-slate-500 mt-0.5">Inactive employees cannot punch in or be included in payroll.</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer flex-shrink-0">
                            <input type="checkbox" id="active" name="active" value="1" checked class="sr-only peer">
                            <span class="w-12 h-7 bg-slate-300 peer-checked:bg-positive rounded-full transition-colors relative after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-transform peer-checked:after:translate-x-5 after:shadow-sm"></span>
                        </label>
                    </div>
                </section>

                <!-- ============ Actions ============ -->
                <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 pb-4">
                    <a href="index.php?page=employees" class="inline-flex items-center justify-center px-5 py-3 rounded-xl border border-line bg-white text-slate-700 text-sm font-semibold hover:bg-ink-50 focus:outline-none focus:ring-2 focus:ring-frost transition-colors min-h-[44px]">Cancel</a>
                    <button type="submit" id="save-btn" class="ui-btn inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-coolant hover:bg-coolant-hover text-white text-sm font-semibold shadow-sm hover:shadow-md focus:outline-none focus:ring-2 focus:ring-frost focus:ring-offset-2 transition-all duration-150 min-h-[44px]">
                        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" /></svg>
                        Save Employee
                    </button>
                </div>

            </form>
        </div>
    </main>
