<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Payroll — Coronacion Timekeeping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/ui.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: {
                            50: '#F6F8FB', 100: '#EEF2F7', 200: '#E1E7F0', 300: '#C3CBDA',
                            400: '#8B98AE', 500: '#5A6A85', 600: '#3A4A66', 700: '#26344F',
                            800: '#1B2740', 900: '#111A2E', DEFAULT: '#0B1220'
                        },
                        coolant: { DEFAULT: '#0E7490', hover: '#155E75', tint: '#E0F2FE' },
                        frost: '#22D3EE',
                        line: '#E1E7F0',
                        positive: '#059669',
                        negative: '#DC2626',
                        warning: '#D97706'
                    },
                    fontFamily: {
                        sans: ['"Segoe UI"', 'system-ui', '-apple-system', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
                        mono: ['"Roboto Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace']
                    }
                }
            }
        };
    </script>
</head>
<body class="font-sans bg-ink-50 text-ink min-h-screen antialiased">

    <header class="lg:hidden sticky top-0 z-30 bg-ink text-white shadow-sm pt-safe">
        <div class="px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <img src="assets/images/coronacion-logo.png"
                alt="Coronacion Logo"
                class="w-12 h-12 object-contain">
                <div>
                    <p class="text-sm font-bold tracking-tight leading-tight">Coronacion</p>
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider leading-tight">Admin</p>
                </div>
            </div>
            <button id="hamburger-btn" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar" class="flex items-center justify-center w-11 h-11 -mr-2 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-frost transition-colors">
                <svg id="icon-menu" class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
                <svg id="icon-close" class="w-6 h-6 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
            </button>
        </div>
    </header>

    <div id="drawer-overlay" class="lg:hidden fixed inset-0 bg-ink/70 z-40 opacity-0 pointer-events-none transition-opacity duration-[220ms]"></div>

    <!-- @sidebar -->

    <main class="lg:pl-72">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8">

            <div class="mb-6 lg:mb-8 page-enter">
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-ink">Payroll</h1>
                <p class="text-sm text-slate-500 mt-1">Compute payroll for a period based on recorded punches.</p>
            </div>

            <section class="bg-white rounded-2xl border border-line shadow-sm p-4 sm:p-6 mb-6 page-enter">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div>
                        <label for="filter-employee" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Employee</label>
                        <select id="filter-employee" class="w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]">
                            <option value="">All employees</option>
                        </select>
                    </div>
                    <div>
                        <label for="filter-start" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Period Start</label>
                        <input type="date" id="filter-start" value="" class="num w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]">
                    </div>
                    <div>
                        <label for="filter-end" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Period End</label>
                        <input type="date" id="filter-end" value="" class="num w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]">
                    </div>
                    <div>
                        <label for="filter-freq" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Pay Frequency</label>
                        <select id="filter-freq" class="w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]">
                            <option value="">All</option>
                            <option value="weekly">Weekly</option>
                            <option value="kinsenas">Kinsenas</option>
                            <option value="monthly">Monthly</option>
                        </select>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-3 mt-5 pt-5 border-t border-line">
                    <button id="compute-btn" type="button" class="ui-btn inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-coolant hover:bg-coolant-hover text-white text-sm font-semibold shadow-sm hover:shadow-md focus:outline-none focus:ring-2 focus:ring-frost focus:ring-offset-2 transition-all duration-150 min-h-[44px]">
                        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 15.75V18m-7.5-6.75h.008v.008H8.25v-.008Zm0 2.25h.008v.008H8.25V13.5Zm0 2.25h.008v.008H8.25v-.008Zm0 2.25h.008v.008H8.25V18Zm2.498-6.75h.007v.008h-.007v-.008Zm0 2.25h.007v.008h-.007V13.5Zm0 2.25h.007v.008h-.007v-.008Zm0 2.25h.007v.008h-.007V18Zm2.504-6.75h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V13.5Zm0 2.25h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V18Zm2.498-6.75h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V13.5ZM8.25 6h7.5v2.25h-7.5V6ZM12 2.25c-1.892 0-3.758.11-5.593.322C5.307 2.7 4.5 3.65 4.5 4.757V19.5a2.25 2.25 0 0 0 2.25 2.25h10.5a2.25 2.25 0 0 0 2.25-2.25V4.757c0-1.108-.806-2.057-1.907-2.185A48.507 48.507 0 0 0 12 2.25Z" /></svg>
                        <span id="compute-label">Compute Payroll</span>
                    </button>
                    <button id="export-csv" type="button" class="ui-btn inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl border border-line bg-white text-slate-700 text-sm font-semibold hover:bg-ink-50 focus:outline-none focus:ring-2 focus:ring-frost transition-colors min-h-[44px] disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
                        Download CSV
                    </button>
                </div>
            </section>

            <section id="results-section" class="hidden bg-white rounded-2xl border border-line shadow-sm overflow-hidden">
                <div class="px-4 sm:px-6 py-4 border-b border-line flex items-center justify-between">
                    <div>
                        <h2 class="text-sm font-bold tracking-tight text-ink">Payroll Summary</h2>
                        <p id="results-period" class="num text-xs text-slate-500 mt-0.5"></p>
                    </div>
                    <p id="results-count" class="num text-xs text-slate-500"></p>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="sticky top-0 z-10">
                            <tr class="border-b border-line bg-ink-50">
                                <th class="text-left px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Employee</th>
                                <th class="text-right px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Regular Hrs</th>
                                <th class="text-right px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500">OT Hrs</th>
                                <th class="text-right px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500">ND Hrs</th>
                                <th class="text-right px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Late (min)</th>
                                <th class="text-right px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500">UT (min)</th>
                                <th class="text-right px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Rate</th>
                                <th class="text-right px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500" title="Extra pay for Sunday duty and holidays. Hover a value for the breakdown.">Sun/Hol</th>
                                <th class="text-right px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Gross Pay</th>
                                <th class="text-right px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Deductions</th>
                                <th class="text-right px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Net Pay</th>
                                <th class="text-left px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Status</th>
                                <th class="text-right px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500"><span class="sr-only">Actions</span></th>
                            </tr>
                        </thead>
                        <tbody id="payroll-tbody" class="divide-y divide-line"></tbody>
                    </table>
                </div>
            </section>

            <section id="empty-state" class="bg-white rounded-2xl border border-line shadow-sm py-16 px-6 text-center page-enter">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-coolant-tint mb-4">
                    <svg class="w-8 h-8 text-coolant" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z" /></svg>
                </div>
                <p class="text-sm font-semibold text-slate-700">No payroll computed yet.</p>
                <p class="text-xs text-slate-500 mt-1">Select a period and click <span class="font-semibold">Compute Payroll</span>.</p>
            </section>

        </div>
    </main>

    <div id="toast-container" class="fixed bottom-4 inset-x-0 z-50 flex flex-col items-center gap-2 px-4 pointer-events-none pb-safe" aria-live="polite"></div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/payroll.js"></script>
    <script src="assets/js/ui.js"></script>
</body>
</html>
