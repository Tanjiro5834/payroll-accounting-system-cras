<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sign In — Coronacion Timekeeping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-sans bg-ink-50 text-ink min-h-screen flex flex-col antialiased">

    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md page-enter">

            <!-- Logo / Wordmark -->
            <div class="text-center mb-8">
                <!-- LOGO PLACEHOLDER: replace with <img src="assets/img/logo.svg"> -->
                <div class="brand-logo mx-auto mb-4" style="--logo-size: 4rem;">LOGO</div>
                <h1 class="font-display text-2xl font-bold tracking-tight text-ink">Coronacion</h1>
                <p class="text-sm text-slate-500 mt-1">Refrigeration &amp; Airconditioning Services</p>
            </div>

            <!-- Login Card -->
            <div class="bg-white rounded-xl border border-line shadow-sm p-6 sm:p-8">
                <h2 class="font-display text-xl font-bold tracking-tight mb-1">Sign in</h2>
                <p class="text-sm text-slate-500 mb-6">Enter your credentials to access the timekeeping system.</p>

                <form id="login-form" method="POST" action="index.php?page=login&action=login" class="space-y-5">
                    <div>
                        <label for="username" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Username</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            autocomplete="username"
                            required
                            class="w-full px-3.5 py-3 rounded-lg border border-line bg-white text-ink text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]"
                            placeholder="e.g. jdelacruz"
                        >
                    </div>

                    <div>
                        <label for="password" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Password</label>
                        <div class="relative">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                autocomplete="current-password"
                                required
                                class="w-full px-3.5 py-3 pr-12 rounded-lg border border-line bg-white text-ink text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]"
                                placeholder="••••••••"
                            >
                            <button
                                type="button"
                                id="toggle-password"
                                aria-label="Show password"
                                class="absolute inset-y-0 right-0 flex items-center justify-center w-12 text-slate-400 hover:text-coolant focus:outline-none focus:ring-2 focus:ring-frost rounded-r-lg transition-colors"
                            >
                                <svg id="icon-eye" class="icon-crossfade w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                </svg>
                                <svg id="icon-eye-off" class="icon-crossfade w-5 h-5 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2.5 cursor-pointer min-h-[44px]">
                            <input
                                type="checkbox"
                                id="remember"
                                name="remember"
                                class="w-4 h-4 rounded border-line text-coolant focus:ring-frost"
                            >
                            <span class="text-sm text-slate-600">Remember me</span>
                        </label>
                        <a href="#" class="text-sm font-medium text-coolant hover:text-coolant-hover transition-colors">Forgot password?</a>
                    </div>

                    <button
                        type="submit"
                        class="w-full min-h-[44px] py-3 px-4 bg-coolant hover:bg-coolant-hover text-white text-sm font-semibold rounded-lg shadow-sm hover:shadow-md hover:-translate-y-px active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-frost focus:ring-offset-2 transition-all duration-150"
                    >
                        Sign in
                    </button>
                </form>
            </div>

            <p class="text-center text-xs text-slate-400 mt-6">&copy; 2026 Coronacion Services. Internal use only.</p>
        </div>
    </main>

    <script src="assets/js/login.js"></script>
</body>
</html>
