<!-- audit-log.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Audit Trail — Coronacion Timekeeping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/ui.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: {
                            50: '#F6F8FB', 100: '#EEF2F7', 200: '#E1E7F0', 300: '#C3CBDA',
                            400: '#8B98AE', 500: '#5A6A85', 600: '#3A4A66', 700: '#26344F',
                            800: '#1B2740', 900: '#111A2E', DEFAULT: '#0B1220'
                        },
                        coolant: { DEFAULT: '#0E7490', hover: '#155E75', tint: '#E0F2FE' },
                        frost: '#22D3EE',
                        line: '#E1E7F0',
                        positive: '#059669',
                        negative: '#DC2626',
                        warning: '#D97706'
                    },
                    fontFamily: {
                        sans: ['"Segoe UI"', 'system-ui', '-apple-system', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
                        mono: ['"Roboto Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace']
                    }
                }
            }
        };
    </script>
</head>
<body class="font-sans bg-ink-50 text-ink min-h-screen antialiased">

    <header class="lg:hidden sticky top-0 z-30 bg-ink text-white shadow-sm pt-safe">
        <div class="px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <img src="assets/images/coronacion-logo.png"
                alt="Coronacion Logo"
                class="w-12 h-12 object-contain">
                <div>
                    <p class="text-sm font-bold tracking-tight leading-tight">Coronacion</p>
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider leading-tight">Admin</p>
                </div>
            </div>
            <button id="hamburger-btn" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar" class="flex items-center justify-center w-11 h-11 -mr-2 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-frost transition-colors">
                <svg id="icon-menu" class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
                <svg id="icon-close" class="w-6 h-6 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
            </button>
        </div>
    </header>

    <div id="drawer-overlay" class="lg:hidden fixed inset-0 bg-ink/70 z-40 opacity-0 pointer-events-none transition-opacity duration-[220ms]"></div>

    <!-- @sidebar -->

    <main class="lg:pl-72">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8">

            <div class="mb-6 lg:mb-8 page-enter">
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-ink">Audit Trail</h1>
                <p class="text-sm text-slate-500 mt-1">Chronological log of user actions and system events.</p>
            </div>

            <section class="bg-white rounded-2xl border border-line shadow-sm p-4 sm:p-6 mb-6 page-enter">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div>
                        <label for="filter-employee" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Employee</label>
                        <select id="filter-employee" class="w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]">
                            <option value="">All employees</option>
                            <option>Juan Dela Cruz</option>
                            <option>Maria Santos</option>
                            <option>Pedro Reyes</option>
                            <option>Ana Villanueva</option>
                        </select>
                    </div>
                    <div>
                        <label for="filter-start" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Date From</label>
                        <input type="date" id="filter-start" class="num w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]">
                    </div>
                    <div>
                        <label for="filter-end" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Date To</label>
                        <input type="date" id="filter-end" class="num w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]">
                    </div>
                    <div>
                        <label for="filter-action" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Action Type</label>
                        <select id="filter-action" class="w-full px-3 py-2.5 rounded-xl border border-line bg-white text-sm focus:outline-none focus:ring-2 focus:ring-frost focus:border-coolant transition-colors min-h-[44px]">
                            <option value="">All actions</option>
                            <option>PUNCH</option>
                            <option>LOGIN</option>
                            <option>LOGOUT</option>
                            <option>EDIT</option>
                            <option>PAYROLL_VIEW</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="bg-white rounded-2xl border border-line shadow-sm overflow-hidden page-enter">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="sticky top-0 z-10">
                            <tr class="border-b border-line bg-ink-50">
                                <th class="text-left px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500 w-8"></th>
                                <th class="text-left px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500 whitespace-nowrap">Timestamp</th>
                                <th class="text-left px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Employee</th>
                                <th class="text-left px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Action</th>
                                <th class="text-left px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Details</th>
                                <th class="text-left px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500 whitespace-nowrap">IP Address</th>
                            </tr>
                        </thead>
                        <tbody id="audit-tbody" class="divide-y divide-line"></tbody>
                    </table>
                </div>
                <div class="px-4 sm:px-6 py-4 border-t border-line text-center">
                    <button id="load-more" class="ui-btn inline-flex items-center gap-2 px-5 py-2.5 rounded-xl border border-line bg-white text-slate-700 text-sm font-semibold hover:bg-ink-50 focus:outline-none focus:ring-2 focus:ring-frost transition-colors min-h-[44px]">
                        Load more
                    </button>
                    <p id="loaded-count" class="num text-xs text-slate-400 mt-2"></p>
                </div>
            </section>

        </div>
    </main>

    <script src="assets/js/audit-log.js"></script>
    <script src="assets/js/ui.js"></script>
</body>
</html>
